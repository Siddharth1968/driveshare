server {
  listen 8080;
  listen [::]:8080;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /uploads/ {
    proxy_pass http://api:4000;
    add_header X-Content-Type-Options nosniff always;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
