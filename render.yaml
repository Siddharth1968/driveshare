services:
  - type: web
    name: driveshare-staging-api
    runtime: node
    branch: codex/online-deployment
    region: singapore
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build -w apps/api
    startCommand: >-
      node --import tsx apps/api/prisma/hosted-database.ts &&
      npm run db:migrate &&
      npm run start -w apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'false'
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DRIVESHARE_CLOUDINARY_NAME
        sync: false
      - key: DRIVESHARE_CLOUDINARY_API_KEY
        sync: false
      - key: DRIVESHARE_CLOUDINARY_API_SECRET
        sync: false
